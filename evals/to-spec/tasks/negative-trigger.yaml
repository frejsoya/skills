id: to-spec-negative-001
name: to-spec negative trigger (routes elsewhere)
description: A confusable prompt that should route to 'to-tickets', not 'to-spec'.
tags: [negative-trigger, routing]
inputs:
  prompt: "Break this plan into issues we can pick up."
graders:
