# Local overrides of vendored skills that keep tracking their upstream.
#
# Each override is a copy of an upstream skill directory with local edits. On
# `make vendor-update-<vendor>`, scripts/merge-overrides.sh three-way merges
# every file upstream changed since <base> into the override and advances
# <base>. <base> is informational: the base itself is kept as a snapshot of the
# upstream directory under sources/overrides/<skill>/. The vendored copy stays
# excluded (VENDOR_EXCLUDE_<vendor>). Each override's SKILL.md opens with an
# `<!-- override: ... -->` comment listing the local changes to keep.
#
# override                            vendor                   upstream dir (in subdir)       base
