# Local overrides of vendored skills that keep tracking their upstream.
#
# Each override is a copy of an upstream skill file with local edits. On
# `make vendor-update-<vendor>`, scripts/merge-overrides.sh three-way merges
# the upstream changes since <base> into the override and advances <base>.
# <base> is informational: the base file is kept at sources/overrides/<skill>.md.
# The vendored copy itself stays excluded (VENDOR_EXCLUDE_<vendor>).
#
# override                           vendor               upstream file (in subdir)        base
